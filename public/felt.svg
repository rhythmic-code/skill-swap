<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <filter id="felt">
    <feTurbulence type="fractalNoise" baseFrequency="0.018 0.016" numOctaves="5" seed="12"/>
    <feColorMatrix type="saturate" values="0.4"/>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
  <filter id="fibre">
    <feTurbulence type="turbulence" baseFrequency="0.4 0.01" numOctaves="2" seed="5"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.88  0 0 0 0 0.84  0 0 0 0 0.77  0 0 0 0.06 0"/>
    <feComposite in2="SourceGraphic" operator="over"/>
  </filter>
  <rect width="360" height="360" fill="oklch(94.3% 0.008 64)" filter="url(#fibre)" opacity="0.5"/>
  <rect width="360" height="360" filter="url(#felt)" opacity="0.06"/>
</svg>
